<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Market Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #030712; color: #f8fafc; min-height: 100vh; padding: 16px; overflow-x: hidden; position: relative; }

        /* Liquid Neon Backgrounds */
        .liquid-blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.6; z-index: -1; animation: float 12s infinite alternate ease-in-out; pointer-events: none; }
        .blob-1 { width: 280px; height: 280px; background: linear-gradient(135deg, #6366f1, #a855f7); top: -60px; left: -60px; }
        .blob-2 { width: 320px; height: 320px; background: linear-gradient(135deg, #ec4899, #3b82f6); bottom: -80px; right: -80px; animation-delay: -6s; }
        .blob-3 { width: 200px; height: 200px; background: linear-gradient(135deg, #10b981, #06b6d4); top: 40%; left: 30%; opacity: 0.3; animation-duration: 16s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(40px, 50px) scale(1.15) rotate(180deg); }
        }

        /* Header & Glass Profile */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .brand-container { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
        .avatar-frame {
            width: 46px; height: 46px; border-radius: 50%; padding: 2px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #0f172a; }
        .brand-info { display: flex; flex-direction: column; }
        .brand-title { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .brand-sub { font-size: 10px; color: #94a3b8; font-weight: 500; }

        .header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 10px 14px; border-radius: 14px; font-size: 12px; font-weight: 700;
            cursor: pointer; backdrop-filter: blur(10px); position: relative; transition: all 0.3s;
        }
        .icon-btn:active { transform: scale(0.95); }
        .cart-badge {
            position: absolute; top: -5px; right: -5px; background: #ec4899; color: #fff;
            font-size: 9px; font-weight: 800; border-radius: 50%; width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center; border: 2px solid #030712;
        }

        /* Controls & Search */
        .controls { margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
        .search-box {
            width: 100%; padding: 14px 18px; border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03);
            color: #fff; outline: none; font-size: 13px; backdrop-filter: blur(15px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); transition: 0.3s;
        }
        .search-box:focus { border-color: #6366f1; box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }

        .filter-row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
        .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .cats::-webkit-scrollbar { display: none; }
        .cat-chip {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap;
            cursor: pointer; color: #94a3b8; backdrop-filter: blur(10px); transition: 0.3s;
        }
        .cat-chip.active { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; border-color: transparent; box-shadow: 0 0 12px rgba(99, 102, 241, 0.4); }

        /* Product Cards Grid */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 80px; }
        .card {
            background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 20px; padding: 12px;
            display: flex; flex-direction: column; justify-content: space-between; position: relative;
            overflow: hidden; transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-4px); border-color: rgba(99, 102, 241, 0.4); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .badge {
            position: absolute; top: 18px; left: 18px; padding: 4px 8px; border-radius: 8px;
            font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; z-index: 2;
        }
        .badge-sale { background: rgba(239, 68, 68, 0.8); color: #fff; backdrop-filter: blur(5px); }
        .badge-new { background: rgba(16, 185, 129, 0.8); color: #fff; backdrop-filter: blur(5px); }
        .badge-top { background: rgba(245, 158, 11, 0.8); color: #fff; backdrop-filter: blur(5px); }

        .card-img-box { width: 100%; height: 130px; border-radius: 14px; overflow: hidden; margin-bottom: 10px; position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover img { transform: scale(1.08); }
        
        .title { font-weight: 700; font-size: 13px; color: #f8fafc; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stock { font-size: 10px; color: #64748b; margin-bottom: 8px; }
        .price-box { display: flex; flex-direction: column; margin-bottom: 10px; }
        .old-price { font-size: 10px; color: #64748b; text-decoration: line-through; }
        .price { font-weight: 800; font-size: 14px; color: #38bdf8; }

        .btn-group { display: flex; gap: 6px; }
        .btn-add {
            flex: 1; background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(99, 102, 241, 0.4); color: #fff; text-align: center; padding: 10px 0;
            border-radius: 12px; font-weight: 700; font-size: 11px; cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s;
        }
        .btn-add:active { transform: scale(0.95); background: linear-gradient(135deg, #6366f1, #a855f7); }
        .btn-disabled { opacity: 0.4; pointer-events: none; border-color: rgba(255,255,255,0.1); }

        /* Floating Cart Bottom Bar */
        .cart-bar {
            position: fixed; bottom: 20px; left: 16px; right: 16px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 90;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); transform: translateY(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cart-bar.active { transform: translateY(0); }
        .cart-bar-info { display: flex; flex-direction: column; }
        .cart-bar-title { font-size: 11px; color: #94a3b8; }
        .cart-bar-total { font-size: 16px; font-weight: 800; color: #38bdf8; }
        .cart-order-btn {
            background: linear-gradient(135deg, #10b981, #059669); color: #fff;
            border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; font-size: 12px; cursor: pointer;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        /* Modals (Admin & Cart) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 100; padding: 20px; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
        .close-modal { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 6px 14px; border-radius: 10px; font-size: 12px; cursor: pointer; font-weight: 700; }

        .admin-tabs { display: flex; gap: 6px; margin-bottom: 16px; background: rgba(255,255,255,0.03); padding: 4px; border-radius: 14px; }
        .tab-btn { flex: 1; background: transparent; border: none; color: #94a3b8; padding: 10px 0; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .tab-btn.active { background: rgba(99, 102, 241, 0.3); color: #fff; border: 1px solid rgba(99, 102, 241, 0.5); }

        .admin-section { display: none; }
        .admin-section.active { display: block; }

        .admin-input {
            width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.04);
            color: #fff; font-size: 12px; outline: none;
        }
        .file-label {
            display: block; width: 100%; padding: 12px; text-align: center;
            background: rgba(255,255,255,0.04); border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 12px; font-size: 12px; color: #cbd5e1; cursor: pointer; margin-bottom: 12px;
        }
        .action-btn {
            width: 100%; background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 13px; cursor: pointer;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .admin-prod-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 12px; border-radius: 16px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center;
        }
        .admin-prod-card img { width: 50px; height: 50px; object-fit: cover; border-radius: 10px; }
        .admin-prod-info { flex: 1; }
        .admin-prod-info input { margin-bottom: 4px; padding: 6px 8px; font-size: 11px; height: 28px; }
        .admin-actions { display: flex; flex-direction: column; gap: 4px; }
        .sm-btn { padding: 6px 8px; border-radius: 8px; font-size: 10px; cursor: pointer; font-weight: 700; border: none; }
        .btn-save { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .btn-del { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

        .loading { text-align: center; font-size: 13px; color: #64748b; margin-top: 50px; }
    </style>
</head>
<body>

    <!-- Header / Brand Section -->

        // Image Compression Utilities
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.src = evt.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 450;
                    canvas.height = img.height * (450 / img.width);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
            reader.readAsDataURL(file);
        }

        function handleFileSelect(e, type, id = null) {

                compressImage(e.target.files[0], (res) => {

                        document.getElementById('file-text').innerText = "✅ Rasm tayyor";

                        e
