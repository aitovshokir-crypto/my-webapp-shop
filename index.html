<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARKET</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: #030712; color: #f8fafc; min-height: 100vh; padding: 16px;
            overflow-x: hidden; position: relative;
        }

        .ambient-shape { position: fixed; border-radius: 50%; filter: blur(60px); z-index: -1; pointer-events: none; }
        .shape-1 { width: 300px; height: 300px; background: rgba(99, 102, 241, 0.4); top: -80px; left: -80px; }
        .shape-2 { width: 350px; height: 350px; background: rgba(236, 72, 153, 0.35); bottom: -100px; right: -100px; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px;
        }
        .brand { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: #fff; cursor: pointer; user-select: none; }
        .lang-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer;
        }

        .controls { margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
        .search-box {
            width: 100%; padding: 12px 16px; border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.04);
            color: #fff; outline: none; font-size: 14px;
        }
        .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .cat-chip {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; color: #94a3b8;
        }
        .cat-chip.active { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: #fff; border-color: transparent; font-weight: 700; }

        #admin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(25px);
            z-index: 100; padding: 20px; overflow-y: auto;
        }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
        .close-admin { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 6px 14px; border-radius: 10px; font-size: 12px; cursor: pointer; font-weight: 700; }

        .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; background: rgba(255,255,255,0.03); padding: 4px; border-radius: 14px; }
        .tab-btn { flex: 1; background: transparent; border: none; color: #94a3b8; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .tab-btn.active { background: rgba(99, 102, 241, 0.3); color: #fff; border: 1px solid rgba(99, 102, 241, 0.5); }

        .admin-section { display: none; }
        .admin-section.active { display: block; }

        .admin-input {
            width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05);
            color: #fff; font-size: 13px; outline: none;
        }
        .file-label {
            display: block; width: 100%; padding: 14px; text-align: center;
            background: rgba(255,255,255,0.04); border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 12px; font-size: 13px; color: #cbd5e1; cursor: pointer; margin-bottom: 14px;
        }
        .action-btn {
            width: 100%; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 14px; cursor: pointer;
        }

        .admin-prod-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 12px; border-radius: 16px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center;
        }
        .admin-prod-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; }
        .admin-prod-info { flex: 1; }
        .admin-prod-info input { margin-bottom: 6px; padding: 6px 10px; font-size: 12px; height: 32px; }
        .admin-actions { display: flex; flex-direction: column; gap: 6px; }
        .save-item-btn { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: 700; }
        .del-item-btn { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: 700; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 12px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 14px; margin-bottom: 10px; }
        .title { font-weight: 600; font-size: 13px; color: #f1f5f9; margin-bottom: 3px; }
        .stock { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
        .price { font-weight: 800; font-size: 14px; color: #38bdf8; margin-bottom: 10px; }
        .btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; text-align: center; padding: 10px 0; border-radius: 12px;
            text-decoration: none; font-weight: 700; font-size: 12px; display: block;
        }
        .btn.disabled { opacity: 0.4; pointer-events: none; }
        .loading { text-align: center; font-size: 13px; color: #64748b; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="ambient-shape shape-1"></div>
    <div class="ambient-shape shape-2"></div>

    <div class="header">
        <div class="brand" id="brand-title">MARKET</div>
        <button class="lang-btn" onclick="toggleLang()" id="lang-btn">UZ</button>
    </div>

    <div class="controls">
        <input type="text" class="search-box" id="search-input" placeholder="Mahsulotlarni qidirish..." oninput="filterProducts()">
        <div class="cats" id="cat-list"></div>
    </div>

    <div class="loading" id="loader">Yuklanmoqda...</div>
    <div class="grid" id="products"></div>

    <!-- Berkitilgan Admin Oynasi -->
    <div id="admin-modal">
        <div class="admin-header">
            <div style="font-weight: 800; font-size: 18px;">🔐 Admin Paneli</div>
            <button class="close-admin" onclick="closeAdminModal()">✕ Chiqish</button>
        </div>

        <div id="admin-auth-box">
            <input type="password" class="admin-input" id="admin-pass" placeholder="Admin parolini kiriting...">
        </div>

        <div id="admin-dashboard" style="display:none;">
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchTab('add', this)" id="tab-add-btn">➕ Qo'shish</button>
                <button class="tab-btn" onclick="switchTab('manage', this)" id="tab-man-btn">⚙️ Tahrirlash</button>
            </div>

            <div class="admin-section active" id="section-add">
                <input type="text" class="admin-input" id="p-name" placeholder="Mahsulot nomi">
                <input type="text" class="admin-input" id="p-price" placeholder="Narxi (masalan: 20 000 so'm)">
                <input type="number" class="admin-input" id="p-stock" placeholder="Soni (masalan: 10)">
                <input type="text" class="admin-input" id="p-cat" placeholder="Bo'lim (masalan: Kiyimlar)">
                <label class="file-label" for="p-file" id="file-text">📁 Galereyadan rasm tanlash</label>
                <input type="file" id="p-file" accept="image/*" style="display:none;" onchange="handleFileSelect(event, 'new')">
                <button class="action-btn" onclick="addProduct()">Qo'shish</button>
            </div>

            <div class="admin-section" id="section-manage">
                <div id="admin-products-list" style="max-height: calc(100vh - 220px); overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <script>
        if(window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.expand();
        const myTelegram = "Xodim_aka";
        
        // Supabase Init
        const SUPABASE_URL = "https://tglbdocejiginifpoloh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_6WV0WtaAi9EgI6Wh3EJMvA_YH-2ncM1";
        let db;

        try {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            console.error("Supabase yuklanmadi:", e);
        }

        let currentLang = 'UZ';
        let allProducts = [];
        let activeCat = 'ALL';
        let isAdmin = false;
        let base64Image = "";
        let editBase64Images = {};

        // MARKET yozuvini 3 marta bosish mantig'i
        let clickCount = 0;
        let clickTimer;
        document.getElementById('brand-title').addEventListener('click', () => {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount >= 3) {
                openAdminModal();
                clickCount = 0;
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
            }
        });

        const dict = {
            UZ: { search: "Mahsulotlarni qidirish...", buy: "Sotib olish", out: "Tugagan", stock: "Mavjud: ", all: "Barchasi", addTab: "➕ Qo'shish", manTab: "⚙️ Tahrirlash" },
            RU: { search: "Поиск товаров...", buy: "Купить", out: "Нет в наличии", stock: "В наличии: ", all: "Все", addTab: "➕ Добавить", manTab: "⚙️ Редактировать" }
        };

        function toggleLang() {
            currentLang = currentLang === 'UZ' ? 'RU' : 'UZ';
            document.getElementById('lang-btn').innerText = currentLang;
            document.getElementById('search-input').placeholder = dict[currentLang].search;
            document.getElementById('tab-add-btn').innerText = dict[currentLang].addTab;
            document.getElementById('tab-man-btn').innerText = dict[currentLang].manTab;
            renderCategories();
            renderProducts(allProducts);
        }

        function openAdminModal() {
            document.getElementById('admin-modal').style.display = 'block';
            if(isAdmin) {
                document.getElementById('admin-auth-box').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                renderAdminManageList();
            }
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        document.getElementById('admin-pass').addEventListener('input', function(e) {
            if(e.target.value === "ZEARZEAR1") {
                isAdmin = true;
                document.getElementById('admin-auth-box').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                renderAdminManageList();
            }
        });

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            if(tab === 'add') document.getElementById('section-add').classList.add('active');
            if(tab === 'manage') {
                document.getElementById('section-manage').classList.add('active');
                renderAdminManageList();
            }
        }

        function handleFileSelect(e, type, id = null) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 450;
                        canvas.height = img.height * (450 / img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const resultImg = canvas.toDataURL('image/jpeg', 0.7);

                        if(type === 'new') {
                            base64Image = resultImg;
                            document.getElementById('file-text').innerText = "✅ Rasm tanlandi";
                        } else if(type === 'edit') {
                            editBase64Images[id] = resultImg;
                            alert("Rasm almashtirildi! Saqlash tugmasini bosing.");
                        }
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        async function loadProducts() {
            try {
                const { data, error } = await db.from('products').select('*');
                document.getElementById('loader').style.display = 'none';
                if(error) {
                    document.getElementById('loader').innerText = "Baza bilan aloqa yo'q yoki bo'sh";
                    document.getElementById('loader').style.display = 'block';
                }
                allProducts = data || [];
                renderCategories();
                renderProducts(allProducts);
                if(isAdmin) renderAdminManageList();
            } catch(e) {
                document.getElementById('loader').innerText = "Yuklashda xatolik bo'ldi";
            }
        }

        function renderCategories() {
            const cats = [dict[currentLang].all, ...new Set(allProducts.map(p => p.category).filter(Boolean))];
            const catContainer = document.getElementById('cat-list');
            catContainer.innerHTML = cats.map(c => {
                const isAll = c === dict[currentLang].all;
                const catKey = isAll ? 'ALL' : c;
                return `<div class="cat-chip ${activeCat === catKey ? 'active' : ''}" onclick="selectCategory('${catKey}')">${c}</div>`;
            }).join('');
        }

        function selectCategory(cat) {
            activeCat = cat;
            renderCategories();
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchesCat = activeCat === 'ALL' || p.category === activeCat;
                const matchesSearch = p.name.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderProducts(filtered);
        }

        function renderProducts(list) {
            const container = document.getElementById('products');
            container.innerHTML = '';
            if(list.length === 0) {
                container.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #64748b; margin-top: 20px;">Mahsulotlar mavjud emas</div>';
                return;
            }
            list.forEach(p => {
                const stockNum = parseInt(p.stock) || 0;
                const isAvailable = stockNum > 0;
                const link = `https://t.me/${myTelegram}?text=Salom!+${encodeURIComponent(p.name)}+sotib+olmoqchiman`;

                container.innerHTML += `
                    <div class="card">
                        <div>
                            <img src="${p.img || 'https://via.placeholder.com/150'}" alt="${p.name}">
                            <div class="title">${p.name}</div>
                            <div class="stock">${dict[currentLang].stock} ${p.stock || 0} ta</div>
                            <div class="price">${p.price}</div>
                        </div>
                        <a href="${link}" target="_blank" class="btn ${!isAvailable ? 'disabled' : ''}">${isAvailable ? dict[currentLang].buy : dict[currentLang].out}</a>
                    </div>
                `;
            });
        }

        function renderAdminManageList() {
            const container = document.getElementById('admin-products-list');
            container.innerHTML = '';
            allProducts.forEach(p => {
                container.innerHTML += `
                    <div class="admin-prod-card">
                        <img src="${p.img || 'https://via.placeholder.com/150'}" onclick="document.getElementById('file-edit-${p.id}').click()" title="Rasmni almashtirish">
                        <input type="file" id="file-edit-${p.id}" accept="image/*" style="display:none;" onchange="handleFileSelect(event, 'edit', ${p.id})">
                        <div class="admin-prod-info">
                            <input type="text" class="admin-input" id="edit-name-${p.id}" value="${p.name}">
                            <input type="text" class="admin-input" id="edit-price-${p.id}" value="${p.price}">
                            <div style="display:flex; gap:6px;">
                                <input type="number" class="admin-input" id="edit-stock-${p.id}" value="${p.stock || 0}" placeholder="Soni">
                                <input type="text" class="admin-input" id="edit-cat-${p.id}" value="${p.category || ''}" placeholder="Bo'lim">
                            </div>
                        </div>
                        <div class="admin-actions">
                            <button class="save-item-btn" onclick="updateProduct(${p.id})">💾 Saqlash</button>
                            <button class="del-item-btn" onclick="deleteProduct(${p.id})">🗑️ O'chirish</button>
                        </div>
                    </div>
                `;
            });
        }

        async function addProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const stock = document.getElementById('p-stock').value || 1;
            const category = document.getElementById('p-cat').value || "Barchasi";

            if(!name || !price) return alert("Nom va narxni kiriting!");

            await db.from('products').insert([{ name, price, stock, category, img: base64Image }]);
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-stock').value = '';
            document.getElementById('p-cat').value = '';
            base64Image = "";
            document.getElementById('file-text').innerText = "📁 Galereyadan rasm tanlash";
            loadProducts();
            alert("Mahsulot qo'shildi!");
        }

        async function updateProduct(id) {
            const name = document.getElementById(`edit-name-${id}`).value;
            const price = document.getElementById(`edit-price-${id}`).value;
            const stock = document.getElementById(`edit-stock-${id}`).value;
            const category = document.getElementById(`edit-cat-${id}`).value;

            let updateData = { name, price, stock, category };
            if(editBase64Images[id]) {
                updateData.img = editBase64Images[id];
            }

            const { error } = await db.from('products').update(updateData).eq('id', id);
            if(error) {
                alert("Xatolik: " + error.message);
            } else {
                alert("O'zgarishlar saqlandi!");
                loadProducts();
            }
        }

        async function deleteProduct(id) {
            if(confirm("Mahsulotni o'chirmoqchimisiz?")) {
                await db.from('products').delete().eq('id', id);
                loadProducts();
            }
        }

        window.onload = function() {
            loadProducts();
        };
    </script>
</body>
</html>
