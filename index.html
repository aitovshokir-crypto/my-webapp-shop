<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Market Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #030712; color: #f8fafc; min-height: 100vh; padding: 16px; overflow-x: hidden; position: relative; }

        .liquid-blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.6; z-index: -1; animation: float 12s infinite alternate ease-in-out; pointer-events: none; }
        .blob-1 { width: 280px; height: 280px; background: linear-gradient(135deg, #6366f1, #a855f7); top: -60px; left: -60px; }
        .blob-2 { width: 320px; height: 320px; background: linear-gradient(135deg, #ec4899, #3b82f6); bottom: -80px; right: -80px; animation-delay: -6s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(40px, 50px) scale(1.15) rotate(180deg); }
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
        }
        .brand-container { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; width: 100%; }
        .avatar-frame {
            width: 46px; height: 46px; border-radius: 50%; padding: 2px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
        }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #0f172a; }
        .brand-info { display: flex; flex-direction: column; }
        .brand-title { font-size: 18px; font-weight: 800; color: #fff; }
        .brand-sub { font-size: 10px; color: #94a3b8; font-weight: 500; }

        .controls { margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
        .search-box {
            width: 100%; padding: 14px 18px; border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03);
            color: #fff; outline: none; font-size: 13px;
        }

        .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .cat-chip {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px; border-radius: 20px; font-size: 11px; white-space: nowrap;
            cursor: pointer; color: #94a3b8;
        }
        .cat-chip.active { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 80px; }
        .card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-img-box { width: 100%; height: 120px; border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .title { font-weight: 700; font-size: 13px; color: #f8fafc; }
        .price { font-weight: 800; font-size: 14px; color: #38bdf8; margin-top: 4px; margin-bottom: 8px; }

        .btn-add {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(168, 85, 247, 0.3));
            border: 1px solid rgba(99, 102, 241, 0.5); color: #fff; padding: 10px 0;
            border-radius: 12px; font-weight: 700; font-size: 11px; cursor: pointer; text-align: center;
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(25px);
            z-index: 100; padding: 20px; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
        .close-modal { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 6px 14px; border-radius: 10px; font-size: 12px; cursor: pointer; }

        .admin-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
        .tab-btn { flex: 1; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; padding: 8px; border-radius: 10px; font-size: 11px; cursor: pointer; }
        .tab-btn.active { background: rgba(99, 102, 241, 0.3); color: #fff; }

        .admin-section { display: none; }
        .admin-section.active { display: block; }

        .admin-input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 12px; }
        .action-btn { width: 100%; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer; }

        .loading { text-align: center; font-size: 13px; color: #64748b; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="liquid-blob blob-1"></div>
    <div class="liquid-blob blob-2"></div>

    <div class="header">
        <div class="brand-container" id="brand-trigger" onclick="handleBrandClick()">
            <div class="avatar-frame">
                <img src="https://via.placeholder.com/100" id="header-avatar" class="avatar-img" alt="Logo">
            </div>
            <div class="brand-info">
                <div class="brand-title" id="header-title">MARKET</div>
                <div class="brand-sub" id="header-sub">Online Do'kon</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <input type="text" class="search-box" id="search-input" placeholder="Mahsulotlarni qidirish..." oninput="filterProducts()">
        <div class="cats" id="cat-list"></div>
    </div>

    <div class="loading" id="loader">Yuklanmoqda...</div>
    <div class="grid" id="products"></div>

    <!-- Hidden Admin Modal -->
    <div class="modal" id="admin-modal">
        <div class="modal-header">
            <div style="font-weight: 800; font-size: 16px;">🔐 Admin Paneli</div>
            <button class="close-modal" onclick="closeAdminModal()">✕ Chiqish</button>
        </div>

        <div id="admin-auth-box">
            <input type="password" class="admin-input" id="admin-pass" placeholder="Admin parolini kiriting..." oninput="checkPassword(this.value)">
        </div>

        <div id="admin-dashboard" style="display:none;">
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchTab('brand', this)">🎨 Brend</button>
                <button class="tab-btn" onclick="switchTab('add', this)">➕ Qo'shish</button>
                <button class="tab-btn" onclick="switchTab('manage', this)">⚙️ Tahrirlash</button>
            </div>

            <div class="admin-section active" id="section-brand">
                <input type="text" class="admin-input" id="b-title" placeholder="Do'kon nomi">
                <input type="text" class="admin-input" id="b-sub" placeholder="Kichik tavsif">
                <button class="action-btn" onclick="saveBrandSettings()">Saqlash</button>
            </div>

            <div class="admin-section" id="section-add">
                <input type="text" class="admin-input" id="p-name" placeholder="Mahsulot nomi">
                <input type="text" class="admin-input" id="p-price" placeholder="Narxi">
                <input type="number" class="admin-input" id="p-stock" placeholder="Soni">
                <input type="text" class="admin-input" id="p-cat" placeholder="Bo'lim">
                <button class="action-btn" onclick="addProduct()">Qo'shish</button>
            </div>

            <div class="admin-section" id="section-manage">
                <div id="admin-products-list"></div>
            </div>
        </div>
    </div>

    <script>
        if(window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.expand();

        const SUPABASE_URL = "https://tglbdocejiginifpoloh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_6WV0WtaAi9EgI6Wh3EJMvA_YH-2ncM1";
        let db;

        try {
            if (window.supabase) {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch(e) {}

        let allProducts = [];
        let clickCount = 0;
        let clickTimer;

        // 3 marta bosish orqali admin modalini ochish
        function handleBrandClick() {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount >= 3) {
                document.getElementById('admin-modal').style.display = 'block';
                clickCount = 0;
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
            }
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        function checkPassword(val) {
            if(val === "ZEARZEAR1") {
                document.getElementById('admin-auth-box').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
            }
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(`section-${tab}`).classList.add('active');
        }

        async function loadProducts() {
            const loader = document.getElementById('loader');
            if(!db) {
                loader.innerText = "Supabase bilan aloqa o'rnatilmoqda...";
                return;
            }

            try {
                const { data, error } = await db.from('products').select('*');
                loader.style.display = 'none';

                if(error) {
                    loader.innerText = "Xatolik bo'ldi";
                    loader.style.display = 'block';
                    return;
                }

                allProducts = data || [];
                renderProducts(allProducts);
            } catch(e) {
                loader.innerText = "Ulanishda xatolik";
                loader.style.display = 'block';
            }
        }

        function renderProducts(list) {
            const container = document.getElementById('products');
            container.innerHTML = '';
            if(!list.length) {
                container.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #64748b;">Mahsulot yo\'q</div>';
                return;
            }
            list.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <div class="card-img-box">
                            <img src="${p.img || 'https://via.placeholder.com/150'}" alt="${p.name}">
                        </div>
                        <div class="title">${p.name}</div>
                        <div class="price">${p.price}</div>
                        <button class="btn-add">Sotib olish</button>
                    </div>
                `;
            });
        }

        window.onload = function() {
            loadProducts();
        };
    </script>
</body>
</html>
