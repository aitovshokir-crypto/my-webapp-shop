<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARKET</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: #090d16; color: #ffffff; min-height: 100vh; padding: 16px;
            overflow-x: hidden; position: relative;
        }

        .shape-1 { position: fixed; width: 220px; height: 220px; background: radial-gradient(circle, rgba(99,102,241,0.35) 0%, rgba(0,0,0,0) 70%); top: -50px; left: -50px; z-index: -1; filter: blur(30px); }
        .shape-2 { position: fixed; width: 250px; height: 250px; background: radial-gradient(circle, rgba(236,72,153,0.3) 0%, rgba(0,0,0,0) 70%); bottom: -50px; right: -50px; z-index: -1; filter: blur(40px); }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; margin-bottom: 14px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: 2px; color: #fff; cursor: pointer; user-select: none; }
        .lang-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }

        /* Controls: Search & Categories */
        .controls { margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
        .search-box { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; outline: none; font-size: 13px; }
        .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .cat-chip { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; color: #cbd5e1; }
        .cat-chip.active { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: #fff; border-color: transparent; font-weight: 700; }

        #admin-panel { display: none; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 16px; border-radius: 20px; margin-bottom: 20px; }
        input, select, button { font-family: inherit; }
        input[type="text"], input[type="number"], input[type="password"], select { width: 100%; padding: 10px 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.08); color: #fff; font-size: 13px; outline: none; }
        .file-label { display: block; width: 100%; padding: 10px; text-align: center; background: rgba(255,255,255,0.08); border: 1px dashed rgba(255,255,255,0.25); border-radius: 12px; font-size: 12px; color: #cbd5e1; cursor: pointer; margin-bottom: 10px; }
        .add-btn { width: 100%; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 14px; margin-bottom: 8px; }
        .title { font-weight: 600; font-size: 13px; color: #f1f5f9; margin-bottom: 2px; }
        .stock { font-size: 11px; color: #a1a1aa; margin-bottom: 4px; }
        .price { font-weight: 800; font-size: 14px; color: #38bdf8; margin-bottom: 8px; }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; text-align: center; padding: 9px 0; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 12px; display: block; }
        .btn.disabled { opacity: 0.5; pointer-events: none; background: rgba(255,255,255,0.05); }
        .del-btn { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; width: 100%; padding: 6px; border-radius: 10px; margin-top: 8px; font-size: 11px; cursor: pointer; }
        .loading { text-align: center; font-size: 13px; color: #64748b; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="shape-1"></div>
    <div class="shape-2"></div>

    <div class="header">
        <div class="brand" id="brand-title">MARKET</div>
        <button class="lang-btn" onclick="toggleLang()" id="lang-btn">UZ</button>
    </div>

    <div class="controls">
        <input type="text" class="search-box" id="search-input" placeholder="Qidirish..." oninput="filterProducts()">
        <div class="cats" id="cat-list"></div>
    </div>

    <div id="admin-panel">
        <input type="password" id="admin-pass" placeholder="Admin parol...">
        <div id="admin-inputs" style="display:none;">
            <input type="text" id="p-name" placeholder="Mahsulot nomi">
            <input type="text" id="p-price" placeholder="Narxi (masalan: 20 000 so'm)">
            <input type="number" id="p-stock" placeholder="Soni (masalan: 10)">
            <input type="text" id="p-cat" placeholder="Bo'lim (masalan: Kiyimlar)">
            <label class="file-label" for="p-file" id="file-text">📁 Galereyadan rasm tanlash</label>
            <input type="file" id="p-file" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
            <button class="add-btn" id="save-btn" onclick="addProduct()">Qo'shish</button>
        </div>
    </div>

    <div class="loading" id="loader">Yuklanmoqda...</div>
    <div class="grid" id="products"></div>

    <script>
        if(window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.expand();
        const myTelegram = "_kasimov_";
        const db = supabase.createClient("https://tglbdocejiginifpoloh.supabase.co", "sb_publishable_6WV0WtaAi9EgI6Wh3EJMvA_YH-2ncM1");

        let currentLang = 'UZ';
        let allProducts = [];
        let activeCat = 'ALL';
        let isAdmin = false;
        let base64Image = "";
        let tapCount = 0;

        const dict = {
            UZ: { search: "Qidirish...", buy: "Sotib olish", out: "Tugagan", stock: "Mavjud: ", all: "Barchasi", add: "Qo'shish", loader: "Yuklanmoqda..." },
            RU: { search: "Поиск...", buy: "Купить", out: "Нет в наличии", stock: "В наличии: ", all: "Все", add: "Добавить", loader: "Загрузка..." }
        };

        function toggleLang() {
            currentLang = currentLang === 'UZ' ? 'RU' : 'UZ';
            document.getElementById('lang-btn').innerText = currentLang;
            document.getElementById('search-input').placeholder = dict[currentLang].search;
            renderCategories();
            renderProducts(allProducts);
        }

        document.getElementById('brand-title').addEventListener('click', () => {
            tapCount++;
            if (tapCount === 3) { document.getElementById('admin-panel').style.display = 'block'; tapCount = 0; }
            setTimeout(() => { tapCount = 0; }, 1500);
        });

        document.getElementById('admin-pass').addEventListener('input', function(e) {
            if(e.target.value === "ZEARZEAR1") {
                isAdmin = true;
                document.getElementById('admin-inputs').style.display = 'block';
                renderProducts(allProducts);
            }
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 450;
                        canvas.height = img.height * (450 / img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        base64Image = canvas.toDataURL('image/jpeg', 0.7);
                        document.getElementById('file-text').innerText = "✅ Rasm tanlandi";
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        async function loadProducts() {
            const { data } = await db.from('products').select('*');
            document.getElementById('loader').style.display = 'none';
            allProducts = data || [];
            renderCategories();
            renderProducts(allProducts);
        }

        function renderCategories() {
            const cats = [dict[currentLang].all, ...new Set(allProducts.map(p => p.category).filter(Boolean))];
            const catContainer = document.getElementById('cat-list');
            catContainer.innerHTML = cats.map(c => {
                const isAll = c === dict[currentLang].all;
                const catKey = isAll ? 'ALL' : c;
                return `<div class="cat-chip ${activeCat === catKey ? 'active' : ''}" onclick="selectCategory('${catKey}')">${c}</div>`;
            }).join('');
        }

        function selectCategory(cat) {
            activeCat = cat;
            renderCategories();
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchesCat = activeCat === 'ALL' || p.category === activeCat;
                const matchesSearch = p.name.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderProducts(filtered);
        }

        function renderProducts(list) {
            const container = document.getElementById('products');
            container.innerHTML = '';
            list.forEach(p => {
                const stockNum = parseInt(p.stock) || 0;
                const isAvailable = stockNum > 0;
                const link = `https://t.me/${myTelegram}?text=Salom!+${encodeURIComponent(p.name)}+sotib+olmoqchiman`;

                container.innerHTML += `
                    <div class="card">
                        <div>
                            <img src="${p.img || 'https://via.placeholder.com/150'}" alt="${p.name}">
                            <div class="title">${p.name}</div>
                            <div class="stock">${dict[currentLang].stock} ${p.stock || 0} шт</div>
                            <div class="price">${p.price}</div>
                        </div>
                        <a href="${link}" target="_blank" class="btn ${!isAvailable ? 'disabled' : ''}">${isAvailable ? dict[currentLang].buy : dict[currentLang].out}</a>
                        ${isAdmin ? `<button class="del-btn" onclick="deleteProduct(${p.id})">O'chirish</button>` : ''}
                    </div>
                `;
            });
        }

        async function addProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const stock = document.getElementById('p-stock').value || 1;
            const category = document.getElementById('p-cat').value || "Barchasi";

            if(!name || !price) return alert("Nom va narxni kiriting!");

            await db.from('products').insert([{ name, price, stock, category, img: base64Image }]);
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-stock').value = '';
            document.getElementById('p-cat').value = '';
            base64Image = "";
            loadProducts();
        }

        async function deleteProduct(id) {
            await db.from('products').delete().eq('id', id);
            loadProducts();
        }

        loadProducts();
    </script>
</body>
</html>
